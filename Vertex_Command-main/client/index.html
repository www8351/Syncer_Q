    <script>
    // Suppress benign, unactionable noise only. Real errors propagate to the
    // console and React error overlay so production crashes are diagnosable.
    (function(){
      window.addEventListener('error',function(e){
        var m=(e&&e.message)||'';
        if(m.indexOf('ResizeObserver')!==-1){ e.stopImmediatePropagation(); }
      },true);
    })();
    </script>
